server {
    listen 47275;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip compression for the JS/CSS game bundle
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        image/png
        image/jpeg;

    location = / {
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # static assets (hashed) can be cached for a long time
    location ~* \.(?:js|css)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # never cache the entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
